  justify-content:center;background:rgba(0,0,0,.82);color:#fffef2;
  font:700 28px/1.4 ui-monospace,Consolas,monospace;text-align:center;letter-spacing:2px}

<script>
/* ── Module config — WASM part birleştirme + CDN yönlendirme ── */
var Module = typeof Module !== "undefined" ? Module : {};

/* WebSocket URL — çok oyunculu için gerekirse değiştir */
Module.websocket = { url: "wss://" };

/* Hata handler */
Module.onAbort = function(e){
  showFatal((__isRu()?"Не удалось запустить игру. ":"Failed to start the game. ")+(e||""));
};

/* Canvas */
Module.canvas = document.getElementById("canvas");

/* YA SDK bekleme (preRun hook'u) */
Module.preRun = Module.preRun || [];
Module.preRun.push(function(){
  /* IndexedDB /saves mount */
  try{
    FS.mkdir("/saves");
    FS.mount(IDBFS,{},"/saves");
    addRunDependency("idbfs-init");
    FS.syncfs(true,function(e){
      if(e) console.error("[Game] initial load error:",e);
      removeRunDependency("idbfs-init");
    });
  }catch(e){ console.warn("[IDBFS]",e); }

  /* YA SDK hazır mı? */
  if(!window.__yaReady){
    addRunDependency("ya-init");
    var _done=false;
    window.__yaOnReady=function(){
      if(!_done){_done=true;removeRunDependency("ya-init");}
    };
    setTimeout(window.__yaOnReady,5000);
  }
});

/* Loading progress — Module.setStatus yerine setProgress */
Module.setStatus = function(e){
  var bar=document.getElementById("loading");
  var pb =document.getElementById("progress-bar");
  if(!e){ /* oyun başladı */
    __started=true;
    if(bar){bar.classList.add("done");setTimeout(function(){bar.style.display="none"},550);}
    return;
  }
  var m=e.match(/(\d+)\s*\/\s*(\d+)/);
  if(m&&pb){
    var pct=Math.min(100,Math.round(100*parseInt(m[1])/parseInt(m[2])));
    setProgress(pct);
  }
};

/* CDN path: index.data CDN'den, index.wasm Module.instantiateWasm ile (aşağıda) */
Module.locateFile = function(path, scriptDir){
  if(path === "index.data") return CDN + "/" + path;
  return scriptDir + path;  /* diğerleri varsayılan */
};

/* ── WASM part indirme + birleştirme ─────────────────────────
   Module.instantiateWasm override — WASM streaming yerine
   part'ları indirip birleştiriyoruz, sonra ArrayBuffer ile compile  */
Module.instantiateWasm = async function(imports, callback){
  try{
    if(WASM_PARTS < 1){
      /* Bölme yoksa direkt CDN'den al */
      setProgress(5,"Downloading WASM...");
      var r=await fetch(CDN+"/index.wasm");
      if(!r.ok) throw new Error("WASM HTTP "+r.status);
      var buf=await r.arrayBuffer();
      setProgress(20,"Compiling...");
      var result=await WebAssembly.instantiate(buf,imports);
      callback(result.instance,result.module);
      return result.exports;
    }

    /* Part indirme — 0% → 60% */
    var parts=[];
    for(var i=0;i<WASM_PARTS;i++){
      var pct=Math.round((i/WASM_PARTS)*60);
      setProgress(pct,"WASM "+(i+1)+"/"+WASM_PARTS+" ("+pct+"%)");
      var r=await fetch(CDN+"/index.wasm.part"+i);
      if(!r.ok) throw new Error("WASM part"+i+" HTTP "+r.status);
      parts.push(new Uint8Array(await r.arrayBuffer()));
      setProgress(Math.round(((i+1)/WASM_PARTS)*60),
                  "WASM "+(i+1)+"/"+WASM_PARTS+" ("+Math.round(((i+1)/WASM_PARTS)*60)+"%)");
    }

    /* Birleştir */
    setProgress(60,"Merging...");
    var total=parts.reduce(function(s,p){return s+p.length;},0);
    var merged=new Uint8Array(total); var off=0;
    for(var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
    console.log("[WASM] merged: "+total+" bytes");

    /* Compile */
    setProgress(65,"Compiling WASM...");
    var result=await WebAssembly.instantiate(merged,imports);
    setProgress(80,"Starting...");
    callback(result.instance,result.module);
    return result.exports;
  }catch(e){
    showFatal("WASM load failed: "+e.message);
    throw e;
  }
};
